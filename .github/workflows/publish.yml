name: Tag & index on pkg.go.dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-go
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build check
        run: go build ./...

      - name: Tag new version
        run: |
          # Tag the CANONICAL version from relata/version.go (kept in lockstep
          # with Cargo.toml's [workspace.package].version by
          # scripts/check_versions.py in the parent repo), not a self-incremented
          # counter. The module path carries /v2 and the Go module proxy only
          # resolves /v2 imports from tags >= v2.0.0 — the old counter logic
          # tagged v0.1.0..v0.1.4, none of which can ever serve the /v2 path,
          # so `go get github.com/relatadb/sdk-go/v2@latest` resolved to a bare
          # commit pseudo-version (observed 2026-08-26:
          # v2.0.0-20260826000147-11899f544794, no tagged version at all).
          NEW="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' relata/version.go)"
          if [ -z "$NEW" ] || [ "$NEW" = "v" ]; then
            echo "cannot read 'const Version' from relata/version.go" >&2
            exit 1
          fi

          # Skip if tag already exists
          if git rev-parse "$NEW" >/dev/null 2>&1; then
            echo "Tag $NEW already exists — skipping."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW"
          git push origin "$NEW"
          echo "Tagged $NEW — pkg.go.dev indexes automatically within minutes."

      - name: Trigger pkg.go.dev index
        run: |
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          curl -s "https://sum.golang.org/lookup/github.com/relatadb/sdk-go@${LATEST}" || true
          echo "https://pkg.go.dev/github.com/relatadb/sdk-go@${LATEST}"
